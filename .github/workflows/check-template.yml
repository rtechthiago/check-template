name: Compara Templates

on:
  workflow_call:

jobs:
  compara_diretorios:
    runs-on: ubuntu-latest
    steps:
    - name: Checa mensagem do commit
      id: commit_message
      run: echo "::set-output name=commit_message::$(git log -1 --pretty=%B)"

    - name: Pega nome da branch pelo commit
      id: extract_branch
      run: |
        COMMIT_MESSAGE=$(echo ${{ steps.commit_message.outputs.commit_message }} | grep -oP '(?<= \[)\w\W+(?=\] )')
    
    - name: Verifica se a Branch existe
      id: verifica_branch
      run: |
        BRANCH_NAME=${{ steps.extract_branch.outputs.extract_branch }}
        if git show-ref --verify --quiet refs/heads/BRANCH_NAME; then
          echo "Branch '$BRANCH_NAME' existe."
          echo "::set-output name=branch_exists::true"
        else
          echo "Branch '$BRANCH_NAME' não existe."
          echo "::set-output name=branch_exists::false"
        fi

    - name: Criar Nova Branch 
      if: steps.verifica_branch.outputs.branch_exists == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.email "you@example.com" 
        git config --global user.name "Your Name" 
        BRANCH_NAME=${{ steps.extract_branch.outputs.branch_name }} 
        NEW_BRANCH_NAME=${BRANCH_NAME}-AUTO 
        git checkout $BRANCH_NAME 
        git checkout -b $NEW_BRANCH_NAME
    
    - name: Checkout repositório atual
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.ref }}
        ssh-key: ${{ secrets.GLOBAL_SSH }}


    - name: Checkout repositório remoto
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
        repository: rtechthiago/check-template
        path: remote_actions
        ref: main
        token: ${{ secrets.GLOBAL_TOKEN }}
    
    - name: Checkout repositório remoto
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
        repository: rtechthiago/template
        path: remote_repo
        ref: main
        token: ${{ secrets.GLOBAL_TOKEN }}

    - name: Configura Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Install dependencies
      run: pip install ruamel.yaml

    - name: Rodando Script de Comparação e Sincronia
      run: |
        python remote_actions/.github/scripts/compare_yaml.py

    - name: Configura workflow
      run: |
        python remote_actions/.github/scripts/set_up_workflow.py


    - name: Faz o push caso apresente falha
      run: |
        rm -rf remote_repo/ && rm -rf remote_actions/
        git config --global user.name ${{ github.actor }}
        git config --global user.email "rtech.thiago@gmail.com"
        git add .github/
        if [[ $(git status --porcelain) ]]; then
          git commit -m "Sync .github com o diretório remoto [skip ci]"
          git push
        else
          echo "Sem mudanças para comitar"
        fi
    continue-on-error: true
